[package]
name = "pg-mcp-agent"
version = "0.1.0"
edition = "2021"
description = "A Rust agent that drives a Postgres MCP server through a local Ollama model, with guarded writes."
default-run = "pg-mcp-agent"

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-util", "io-std", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
reqwest = { version = "0.12", features = ["json"] }
anyhow = "1"
# Optional heavier analytics engine (local analytical SQL over a result set).
# Enable with: cargo build --features datafusion
datafusion = { version = "50", optional = true }
# Optional HTTP API server for the React UI. Enable with: cargo build --features server
axum = { version = "0.7", optional = true }
tower-http = { version = "0.6", features = ["cors", "fs"], optional = true }
tokio-stream = { version = "0.1", optional = true }

[features]
datafusion = ["dep:datafusion"]
server = ["dep:axum", "dep:tower-http", "dep:tokio-stream"]

# HTTP API for the web UI. Only built with the `server` feature:
#   cargo run --features server --bin api_server -- config.pagila.json
[[bin]]
name = "api_server"
path = "src/bin/api_server.rs"
required-features = ["server"]
