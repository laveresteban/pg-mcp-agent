<svg xmlns="http://www.w3.org/2000/svg" width="674" height="354" viewBox="0 0 674 354" font-family="ui-monospace,SFMono-Regular,Consolas,monospace">
<rect x="0" y="0" width="674" height="354" rx="8" fill="#0d1117"/>
